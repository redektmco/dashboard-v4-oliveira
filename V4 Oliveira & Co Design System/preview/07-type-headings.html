<!DOCTYPE html>
<!-- @dsCard group="Type" name="Headings scale" subtitle="H1 → H4 (BI app density)" viewport="700x320" --><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row {
  display: grid; grid-template-columns: 90px 1fr 1fr; gap: 14px;
  align-items: baseline;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: 0; }
.label { font: var(--t-mono-sm); color: var(--fg-4); }
.spec { font: var(--t-mono-sm); color: var(--fg-3); justify-self: end; }
.h1 { font: var(--t-h1); }
.h2 { font: var(--t-h2); }
.h3 { font: var(--t-h3); }
.h4 { font: var(--t-h4); }
</style></head><body><div class="card">
  <div class="eyebrow" style="margin-bottom: 10px;">Escala BI · Cabeçalhos</div>
  <div class="row"><span class="label">H1 / 28</span><span class="h1">Health Score do mês</span><span class="spec">700 · 28/1.2</span></div>
  <div class="row"><span class="label">H2 / 22</span><span class="h2">Carteira de clientes</span><span class="spec">700 · 22/1.25</span></div>
  <div class="row"><span class="label">H3 / 17</span><span class="h3">Pipeline da semana</span><span class="spec">600 · 17/1.3</span></div>
  <div class="row"><span class="label">H4 / 14</span><span class="h4">Squad da Oliveira</span><span class="spec">600 · 14/1.35</span></div>
</div></body></html>
