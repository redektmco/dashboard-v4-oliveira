<!DOCTYPE html>
<!-- @dsCard group="Colors" name="V4 Red" subtitle="Brand red scale 500 → 900" viewport="700x200" --><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sw {
  border-radius: var(--radius-md);
  padding: 14px 14px 16px;
  display: flex; flex-direction: column;
  gap: 28px;
  min-height: 124px;
  color: #fff;
  border: 1px solid var(--border);
}
.sw .name { font: var(--t-h4); }
.sw .hex { font: var(--t-mono-sm); opacity: 0.8; }
</style></head><body><div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Vermelho V4 · Cor primária</div>
  <div class="swatches">
    <div class="sw" style="background: var(--v4-red-500);"><div class="name">red 500</div><div class="hex">#e50914</div></div>
    <div class="sw" style="background: var(--v4-red-600);"><div class="name">red 600</div><div class="hex">#b20710</div></div>
    <div class="sw" style="background: var(--v4-red-700);"><div class="name">red 700</div><div class="hex">#80050b</div></div>
    <div class="sw" style="background: var(--v4-red-900);"><div class="name">red 900</div><div class="hex">#400306</div></div>
  </div>
</div></body></html>
