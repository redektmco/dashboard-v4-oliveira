<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="sm · md · lg · xl · pill" viewport="700x200" --><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: end; }
.s {
  background: var(--v4-red-500);
  display: flex; flex-direction: column; gap: 8px;
  align-items: center;
}
.box { width: 100%; aspect-ratio: 1; background: var(--v4-red-500); }
.col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tk { font: var(--t-mono-sm); color: var(--fg-3); }
.px { font: var(--t-caption); color: var(--fg-4); }
</style></head><body><div class="card">
  <div class="col"><div class="box" style="border-radius: 4px;"></div><div class="tk">--radius-sm</div><div class="px">4px</div></div>
  <div class="col"><div class="box" style="border-radius: 8px;"></div><div class="tk">--radius-md</div><div class="px">8px</div></div>
  <div class="col"><div class="box" style="border-radius: 12px;"></div><div class="tk">--radius-lg</div><div class="px">12px</div></div>
  <div class="col"><div class="box" style="border-radius: 16px;"></div><div class="tk">--radius-xl</div><div class="px">16px</div></div>
  <div class="col"><div class="box" style="border-radius: 999px;"></div><div class="tk">--radius-pill</div><div class="px">999</div></div>
</div></body></html>
