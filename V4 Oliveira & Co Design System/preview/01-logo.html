<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo lockups" subtitle="Símbolo · símbolo+company · logotipo completo" viewport="700x220" --><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.card { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: stretch; }
.lockup {
  background: var(--bg-elev-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  min-height: 160px;
}
.lockup.light { background: var(--v4-white); border-color: transparent; }
.lockup img { display: block; }
.lockup .meta {
  font: var(--t-mono-sm);
  color: var(--fg-4);
}
.lockup.light .meta { color: #666; }
</style></head><body><div class="card">
  <div class="lockup">
    <img src="../assets/v4-simbolo.webp" alt="V4 symbol" style="height: 88px;">
    <span class="meta">símbolo</span>
  </div>
  <div class="lockup">
    <img src="../assets/v4-simbolo-company.webp" alt="V4 + Company" style="height: 56px;">
    <span class="meta">símbolo + company</span>
  </div>
  <div class="lockup light">
    <img src="../assets/v4-logo-completa.webp" alt="V4 Company logotipo" style="height: 56px;">
    <span class="meta">logotipo completo</span>
  </div>
</div></body></html>
